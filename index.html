                  </div>

                  <div className="p-6 rounded-3xl bg-sunshine-900 border border-sunshine-800 space-y-4 shadow-lg">
                    <h3 className="text-lg font-bold text-rose-400">Philanthropy & Hobbies</h3>
                    <p className="text-xs text-slate-300 leading-relaxed">{PHILANTHROPY_HOBBIES.philanthropy}</p>
                    <div className="p-3 rounded-xl bg-sunshine-950 border border-sunshine-800 text-xs text-slate-300">
                      <strong>Notable Hobbies:</strong> {PHILANTHROPY_HOBBIES.hobbies}
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* DETAIL MODAL FOR EVERY CLICKED ITEM */}
          {selectedItem && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-sunshine-900 border border-amber-500/50 rounded-3xl max-w-2xl w-full p-8 space-y-6 relative shadow-2xl animate-in fade-in zoom-in duration-200">
                <button 
                  onClick={() => setSelectedItem(null)}
                  className="absolute top-6 right-6 p-2 rounded-full bg-sunshine-950 text-slate-400 hover:text-white"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="space-y-2">
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
                    Verified Sunshine Dossier
                  </span>
                  <h3 className="text-2xl font-black text-white">{selectedItem.title}</h3>
                </div>

                <div className="p-6 rounded-2xl bg-sunshine-950 border border-sunshine-800 text-xs text-slate-300 space-y-3 leading-relaxed max-h-[60vh] overflow-y-auto">
                  {typeof selectedItem.content === 'object' ? (
                    Object.entries(selectedItem.content).map(([k, v]) => (
                      <div key={k} className="border-b border-sunshine-800 pb-2">
                        <strong className="text-amber-400 uppercase text-[10px] tracking-wider block mb-0.5">{k}:</strong>
                        <span>{typeof v === 'object' ? JSON.stringify(v) : v}</span>
                      </div>
                    ))
                  ) : (
                    <p className="whitespace-pre-line text-sm">{selectedItem.content}</p>
                  )}
                </div>

                <div className="pt-4 border-t border-sunshine-800 flex items-center justify-between text-xs text-slate-400">
                  <span>Curated & Published by Amim Ahsan</span>
                  <a href="https://amimahsanlibrary.blogspot.com" target="_blank" rel="noopener noreferrer" className="text-amber-400 underline font-bold">
                    amimahsanlibrary.blogspot.com
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-auto border-t border-rose-950 bg-sunshine-900 py-8 px-4 text-xs text-slate-400 text-center space-y-2">
            <div className="font-bold text-slate-200">Katrina Kaif Sunshine Archive: Holistic Filmic Essence</div>
            <div>Designed with premium sunshine luxury by <strong>Amim Ahsan</strong>. Explore more at <a href="https://amimahsanlibrary.blogspot.com" target="_blank" rel="noopener noreferrer" className="text-amber-400 underline">amimahsanlibrary.blogspot.com</a></div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
